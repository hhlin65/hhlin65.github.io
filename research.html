function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function au(x){return esc(x).replace(/(林信宏|Hsin-Hung Lin)/g,'<b class="me">$1</b>')}
var cats=[],cnt={};D.forEach(function(r){if(!cnt[r[0]]){cnt[r[0]]=0;cats.push(r[0])}cnt[r[0]]++});
var cur='全部';
function drawFilters(){
  var h='<button type="button" class="fc'+(cur==='全部'?' on':'')+'" data-c="全部">全部 '+D.length+'</button>';
  cats.forEach(function(c){h+='<button type="button" class="fc'+(cur===c?' on':'')+'" data-c="'+c+'">'+c+' '+cnt[c]+'</button>'});
  document.getElementById('filters').innerHTML=h;
}
function drawList(){
  var L=D.filter(function(r){return cur==='全部'||r[0]===cur});
  document.getElementById('pubCount').textContent=L.length+' 筆';
  document.getElementById('pubList').innerHTML=L.map(function(r){
    var link=r[6]?'<a class="dl" href="'+r[6]+'" target="_blank" rel="noopener">全文／下載 →</a>':'';
    return '<li><div class="py">'+r[1]+'</div><div class="pb"><span class="pt">'+r[0]+'</span><h4>'+esc(r[3])+'</h4><p class="pa">'+au(r[2])+'</p><p class="pv">'+esc(r[4])+(r[5]?'<br>'+esc(r[5]):'')+'</p>'+link+'</div></li>';
  }).join('');
}
document.getElementById('filters').addEventListener('click',function(e){var b=e.target.closest('.fc');if(!b)return;cur=b.getAttribute('data-c');drawFilters();drawList()});
drawFilters();drawList();
document.getElementById('stTotal').textContent=D.length;
var ys=D.map(function(r){return +r[1]});
document.getElementById('stRange').textContent=Math.min.apply(null,ys)+'–'+Math.max.apply(null,ys)+' 年';
document.getElementById('stCats').innerHTML=cats.map(function(c){return '<li><b>'+cnt[c]+'</b><span>'+c+'</span></li>'}).join('');
